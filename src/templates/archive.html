{% extends "base.html" %}

{% block title %}归档 - {{ site.title }}{% endblock %}

{% block content %}
<h1 style="margin-bottom:24px">文章归档</h1>
{% for year in archive %}
<h2 class="archive-year">{{ year.year }}</h2>
<ul class="archive-list">
  {% for post in year.posts %}
  <li class="archive-item">
    <a href="{{ root }}posts/{{ post.slug }}/">{{ post.title }}</a>
    <span>{{ post.dateDisplay }}</span>
  </li>
  {% endfor %}
</ul>
{% endfor %}
{% endblock %}
