<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{% block desc %}{{ site.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ root }}assets/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ root }}feed.xml">
</head>
<body>
  <header class="site-header">
    <div class="container inner">
      <a class="site-title" href="{{ root }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ root }}">首页</a>
        <a href="{{ root }}archive">归档</a>
        <a href="{{ root }}tags">标签</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.year }} {{ site.title }}. Powered by Bogl.</p>
    </div>
  </footer>
  <script src="{{ root }}assets/js/main.js"></script>
</body>
</html>
